name: Build and Publish Bindings vendordep
on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: "Release version number"
        type: string
        required: true
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      releaseVersion: ${{ inputs.releaseVersion }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Clone dev branch
        run: |
          gh repo clone EarthQuakers9094/Bindings -- -b main
      - name: Copy source over
        run: |
          rm -rf src/main/java/org/earthquakers9094/
          cp -r Bindings src/main/java/org/earthquakers9094/
      - name: Removing source repo
        run: |
          rm -rf Bindings
      - name: Setup Kotlin
        uses: fwilhe2/setup-kotlin@0.2.0
      - name: Install roboRio toolchain
        run: ./gradlew installRoboRioToolchain
      - name: Build vendordep
        run: ./gradlew build
      - name: Publish vendordep
        run: ./gradlew publish
      - name: Update repository
        run: |
          git config --global user.name "astaugaard"
          git config --global user.email "astaugaard@icloud.com"
          git add .
          git commit -m "Upgrading to ${{ inputs.releaseVersion }}"
          git push
